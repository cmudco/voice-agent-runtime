name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search [open and closed issues](https://github.com/cmudco/voice-agent-runtime/issues?q=is%3Aissue) first. Found a security vulnerability? Do not use this form: [report it privately](https://github.com/cmudco/voice-agent-runtime/security/policy).
  - type: dropdown
    id: service
    attributes:
      label: Where does it fail?
      options:
        - "Socratic Bots backend"
        - "Socratic Bots frontend"
        - "Voice runtime"
        - "DARE backend"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Branch and commit, or the URL of the deployment.
      placeholder: "main @ 1a2b3c4"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The fewest steps that show the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Runtime logs
      description: "The relevant runtime log lines, with the session ID and the time it happened. Remove keys, tokens and student data."
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "OS, Python version, browser, and whether the Whisper backup is configured."
      placeholder: "Ubuntu 24.04, Python 3.12, Chrome 141, Whisper on"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, recordings or related issues. Drag files in.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed keys, tokens and student data from everything above.
          required: true
        - label: An AI tool helped write this report.
